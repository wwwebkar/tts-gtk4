[package]
name = "tts-overlay"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_10"] }
gtk4-layer-shell = "0.4"
async-channel = "2"
cpal = "0.15"
rustfft = "6"
serde_json = "1"
unicode-normalization = "0.1"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "cuda"] }

[profile.release]
opt-level = 3
lto = "thin"
